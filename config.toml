# The URL the site will be built for
base_url = "https://doomy.org"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true
title = "doomy"
description = "the world's smallest web site, covered in rust"
theme = "feather"

generate_feeds = true

taxonomies = [{ name = "tags", feed = true }]

[markdown]
external_links_target_blank = true

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "ayu-dark"
style = "class"

[extra]

[extra.feather]
head = ""
timezone = "America/New_York"
cusdis_id = "aaae44f5-19b5-419e-88d9-9522e2617ece"
social =  { url = "https://mastodon.social/@doomy", display = "@doomy@mastodon.social" }

[extra.feather.analytics]
goatcounter_id = "doomy-org"
